<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân loại Hoa Iris</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4a5568;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #3182ce;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2b6cb0;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            transform: none !important;
        }

        /* --- SPINNER & ANIMATION --- */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* --- KẾT QUẢ --- */
        .placeholder-box {
            margin-top: 24px;
            padding: 20px;
            border: 2px dashed #e2e8f0;
            border-radius: 8px;
            text-align: center;
            color: #a0aec0;
        }

        .result-box {
            margin-top: 24px;
            padding: 20px;
            background-color: #f7fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            text-align: center;
            display: none;
        }

        .result-box h3 {
            color: #2b6cb0;
            margin-bottom: 12px;
            font-size: 20px;
        }

        .flower-img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 10px;
        }

        /* --- BẢNG LỊCH SỬ --- */
        .history-section {
            margin-top: 30px;
        }

        .history-section h4 {
            margin-bottom: 10px;
            color: #4a5568;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 8px 10px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        th {
            background-color: #edf2f7;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Phân loại Hoa Iris</h2>

        <div class="form-group">
            <label for="sepal_length">Chiều dài đài hoa (Sepal Length - cm):</label>
            <input type="number" id="sepal_length" step="0.1" placeholder="Ví dụ: 5.1">
        </div>

        <div class="form-group">
            <label for="sepal_width">Chiều rộng đài hoa (Sepal Width - cm):</label>
            <input type="number" id="sepal_width" step="0.1" placeholder="Ví dụ: 3.5">
        </div>

        <div class="form-group">
            <label for="petal_length">Chiều dài cánh hoa (Petal Length - cm):</label>
            <input type="number" id="petal_length" step="0.1" placeholder="Ví dụ: 1.4">
        </div>

        <div class="form-group">
            <label for="petal_width">Chiều rộng cánh hoa (Petal Width - cm):</label>
            <input type="number" id="petal_width" step="0.1" placeholder="Ví dụ: 0.2">
        </div>

        <button id="btn-predict" class="btn-submit" onclick="predict()">
            <span id="btn-text">Dự đoán ngay</span>
        </button>

        <!-- Trạng thái chờ -->
        <div id="placeholder" class="placeholder-box">
            Nhập các thông số và bấm "Dự đoán ngay" để xem kết quả.
        </div>

        <!-- Khung kết quả -->
        <div id="result" class="result-box">
            <p>Kết quả dự đoán:</p>
            <h3 id="prediction">--</h3>
            <img id="flower-image" class="flower-img" src="" alt="Ảnh hoa dự đoán">
        </div>

        <!-- Bảng lịch sử dự đoán -->
        <div class="history-section">
            <h4>Lịch sử dự đoán</h4>
            <table>
                <thead>
                    <tr>
                        <th>SL</th>
                        <th>SW</th>
                        <th>PL</th>
                        <th>PW</th>
                        <th>Kết quả</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <!-- Dữ liệu lịch sử sẽ thêm vào đây -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const flowerNamesVN = {
            "iris-setosa": "Hoa Iris Setosa",
            "iris-versicolor": "Hoa Iris Versicolor",
            "iris-virginica": "Hoa Iris Virginica",
            "setosa": "Hoa Iris Setosa",
            "versicolor": "Hoa Iris Versicolor",
            "virginica": "Hoa Iris Virginica"
        };

        const historyData = [];

        async function predict() {
            const rawSepalLength = document.getElementById("sepal_length").value;
            const rawSepalWidth = document.getElementById("sepal_width").value;
            const rawPetalLength = document.getElementById("petal_length").value;
            const rawPetalWidth = document.getElementById("petal_width").value;

            if (!rawSepalLength || !rawSepalWidth || !rawPetalLength || !rawPetalWidth) {
                alert("Vui lòng nhập đầy đủ cả 4 thông số!");
                return;
            }

            const sl = Number(rawSepalLength);
            const sw = Number(rawSepalWidth);
            const pl = Number(rawPetalLength);
            const pw = Number(rawPetalWidth);

            const btn = document.getElementById("btn-predict");
            const btnText = document.getElementById("btn-text");

            // Bật hiệu ứng loading trên nút
            btn.disabled = true;
            btnText.innerHTML = `<span class="spinner"></span> Đang phân tích...`;

            const data = { sepal_length: sl, sepal_width: sw, petal_length: pl, petal_width: pw };

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || "Có lỗi xảy ra từ máy chủ");

                const rawPrediction = result.prediction.toLowerCase();
                const vnName = flowerNamesVN[rawPrediction] || result.prediction;

                const placeholder = document.getElementById("placeholder");
                const resultContainer = document.getElementById("result");

                // Hiển thị khung kết quả kèm animation popIn
                placeholder.style.display = "none";
                resultContainer.style.display = "block";

                resultContainer.classList.remove("animate-pop");
                void resultContainer.offsetWidth; // Trigger reflow để reset animation
                resultContainer.classList.add("animate-pop");

                document.getElementById("prediction").innerText = vnName;

                let imageName = rawPrediction.replace("iris-", "");
                const image = document.getElementById("flower-image");
                image.src = "/photo/" + imageName + ".jpg";
                image.alt = vnName;

                // Thêm vào lịch sử
                historyData.unshift({ sl, sw, pl, pw, prediction: vnName });
                updateHistoryTable();

            } catch (error) {
                alert("Lỗi: " + error.message);
            } finally {
                // Tắt trạng thái loading
                btn.disabled = false;
                btnText.innerText = "Dự đoán ngay";
            }
        }

        function updateHistoryTable() {
            const tbody = document.getElementById("history-body");
            tbody.innerHTML = "";

            historyData.slice(0, 5).forEach(item => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${item.sl}</td>
                    <td>${item.sw}</td>
                    <td>${item.pl}</td>
                    <td>${item.pw}</td>
                    <td><b>${item.prediction}</b></td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
