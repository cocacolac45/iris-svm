<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris SVM Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 50%, #ffd6ff 100%);
            background-attachment: fixed;
            padding: 30px 20px;
            color: #5c3d46;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(229, 152, 170, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h1 {
            text-align: center;
            color: #d85777;
            font-size: 2.1rem;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #b07283;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        /* Bố cục nằm ngang chính */
        .main-content {
            display: flex;
            align-items: center;
            gap: 24px;
            background: #fff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(230, 175, 190, 0.12);
            border: 1px solid #ffe5ec;
        }

        /* Khối nhập liệu có thanh cuộn ngang */
        .form-wrapper {
            flex: 1.5;
            min-width: 0; /* Đảm bảo scrollbar hoạt động chuẩn trong flexbox */
        }

        .form {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 8px 4px 16px 4px;
            scroll-behavior: smooth;
        }

        /* Tùy chỉnh thanh cuộn ngang tone hồng pastel */
        .form::-webkit-scrollbar {
            height: 6px;
        }
        .form::-webkit-scrollbar-track {
            background: #fff0f3;
            border-radius: 10px;
        }
        .form::-webkit-scrollbar-thumb {
            background: #f4abb7;
            border-radius: 10px;
        }
        .form::-webkit-scrollbar-thumb:hover {
            background: #e88698;
        }

        .input-group {
            flex: 0 0 160px;
            background: #fff8f9;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid #ffe3e8;
            transition: all 0.25s ease;
        }

        .input-group:hover {
            border-color: #f4abb7;
            transform: translateY(-2px);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #8c4a5c;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #f9ccd5;
            border-radius: 10px;
            font-size: 15px;
            color: #6b3343;
            background-color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #d85777;
            box-shadow: 0 0 0 3px rgba(216, 87, 119, 0.15);
        }

        /* Nút dự đoán đặt ở giữa */
        .button-wrapper {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
        }

        button {
            padding: 18px 28px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #e88698, #d85777);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(216, 87, 119, 0.25);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 22px rgba(216, 87, 119, 0.35);
            background: linear-gradient(135deg, #ed94a4, #e06281);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Khối kết quả bên phải */
        #result {
            display: none;
            flex: 1;
            min-width: 220px;
            padding: 20px;
            text-align: center;
            background: #fff5f7;
            border: 1.5px solid #ffe0e6;
            border-radius: 18px;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #result > div:first-child {
            color: #b07283;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        #prediction {
            font-size: 20px;
            font-weight: 700;
            color: #c94466;
            margin-top: 4px;
        }

        #flower-image {
            display: block;
            width: 140px;
            height: 140px;
            object-fit: cover;
            margin: 12px auto 0;
            border-radius: 14px;
            border: 2px solid #ffffff;
            box-shadow: 0 6px 16px rgba(201, 68, 102, 0.12);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #b07283;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .back:hover {
            color: #d85777;
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(12px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Responsive cho màn hình nhỏ */
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                align-items: stretch;
            }
            .form-wrapper {
                width: 100%;
            }
            button {
                width: 100%;
            }
            #result {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🌸 Iris Flower Classification</h1>
        <p class="subtitle">Phân loại hoa Iris bằng mô hình SVM</p>

        <!-- Bố cục nằm ngang -->
        <div class="main-content">
            
            <!-- Phần nhập liệu (Có thanh cuộn ngang) -->
            <div class="form-wrapper">
                <div class="form">
                    <div class="input-group">
                        <label>Sepal Length</label>
                        <input id="sepal_length" type="number" step="0.1" value="5.1">
                    </div>

                    <div class="input-group">
                        <label>Sepal Width</label>
                        <input id="sepal_width" type="number" step="0.1" value="3.5">
                    </div>

                    <div class="input-group">
                        <label>Petal Length</label>
                        <input id="petal_length" type="number" step="0.1" value="1.4">
                    </div>

                    <div class="input-group">
                        <label>Petal Width</label>
                        <input id="petal_width" type="number" step="0.1" value="0.2">
                    </div>
                </div>
            </div>

            <!-- Nút bấm ở giữa -->
            <div class="button-wrapper">
                <button onclick="predict()">🔍 Dự đoán</button>
            </div>

            <!-- Kết quả bên phải -->
            <div id="result">
                <div>Kết quả:</div>
                <div id="prediction"></div>
                <img id="flower-image" src="" alt="Flower">
            </div>

        </div>

        <a href="/" class="back">← Quay lại trang giới thiệu</a>
    </div>

    <script>
        async function predict() {
            const data = {
                sepal_length: Number(document.getElementById("sepal_length").value),
                sepal_width: Number(document.getElementById("sepal_width").value),
                petal_length: Number(document.getElementById("petal_length").value),
                petal_width: Number(document.getElementById("petal_width").value)
            };

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Có lỗi xảy ra");
                }

                // Hiển thị tên loài
                document.getElementById("prediction").innerText = result.prediction.toUpperCase();

                // Hiển thị hình tương ứng
                const image = document.getElementById("flower-image");
                image.src = "/photo/" + result.prediction + ".jpg";
                image.alt = result.prediction;

                // Hiển thị kết quả (Dùng flex để giữ đúng layout ngang)
                document.getElementById("result").style.display = "block";

            } catch (error) {
                alert("Không thể kết nối đến API: " + error.message);
            }
        }
    </script>

</body>

</html>
