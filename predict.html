<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris SVM Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 50%, #f43f5e 100%);
            background-attachment: fixed;
            padding: 30px 20px;
            color: #4c0519;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(225, 29, 72, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            text-align: center;
            color: #e11d48;
            font-size: 2.1rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #9f1239;
            margin-bottom: 30px;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* Layout 2 cột nằm ngang */
        .layout-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            align-items: start;
        }

        /* Khối bên trái: Nhập số liệu */
        .input-section {
            background: #fff1f2;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #ffe4e6;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #be123c;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #fecdd3;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        label {
            font-weight: 600;
            color: #881337;
            font-size: 0.9rem;
        }

        .input-control-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Ô nhập số */
        input[type="number"] {
            width: 80px;
            padding: 8px 10px;
            border: 1.5px solid #fda4af;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #9f1239;
            background-color: #ffffff;
            text-align: center;
            outline: none;
            transition: all 0.2s;
        }

        input[type="number"]:focus {
            border-color: #e11d48;
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
        }

        /* Thanh kéo (Slider) tông đỏ hồng */
        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 5px;
            background: #fecdd3;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e11d48;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(225, 29, 72, 0.4);
            transition: all 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #be123c;
        }

        /* Nút dự đoán đặt ở dưới phần nhập số liệu */
        button {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #e11d48, #fb7185);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(225, 29, 72, 0.3);
            transition: all 0.25s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #be123c, #f43f5e);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(225, 29, 72, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Khối bên phải: Kết quả */
        .result-section {
            background: #fff;
            padding: 24px;
            border-radius: 20px;
            border: 1.5px solid #fecdd3;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #result {
            display: none;
            text-align: center;
            margin-top: 15px;
            animation: fadeIn 0.4s ease-out;
        }

        .result-label {
            color: #9f1239;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #prediction {
            font-size: 24px;
            font-weight: 800;
            color: #be123c;
            margin: 6px 0 15px;
        }

        #flower-image {
            display: block;
            width: 100%;
            max-width: 200px;
            height: 200px;
            object-fit: cover;
            margin: 0 auto;
            border-radius: 14px;
            border: 3px solid #fff1f2;
            box-shadow: 0 6px 16px rgba(190, 18, 60, 0.15);
        }

        .placeholder-text {
            color: #fda4af;
            text-align: center;
            margin: auto;
            font-style: italic;
            font-size: 0.95rem;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #e11d48;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .back:hover {
            color: #be123c;
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🌸 Iris Flower Classification</h1>
        <p class="subtitle">Phân loại hoa Iris bằng mô hình SVM</p>

        <!-- Bố cục Nằm Ngang: Nhập số liệu (Trái) - Kết quả (Phải) -->
        <div class="layout-grid">
            
            <!-- Cột trái: Nhập số liệu + Nút -->
            <div class="input-section">
                <div class="section-title">Nhập số liệu</div>
                
                <div class="form">
                    <div class="form-group">
                        <div class="label-row">
                            <label>Sepal Length</label>
                        </div>
                        <div class="input-control-wrap">
                            <input id="sepal_length" type="number" step="0.1" value="5.1" oninput="syncRange('sepal_length', 'sepal_length_range')">
                            <input id="sepal_length_range" type="range" min="0" max="10" step="0.1" value="5.1" oninput="syncInput('sepal_length', 'sepal_length_range')">
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label>Sepal Width</label>
                        </div>
                        <div class="input-control-wrap">
                            <input id="sepal_width" type="number" step="0.1" value="3.5" oninput="syncRange('sepal_width', 'sepal_width_range')">
                            <input id="sepal_width_range" type="range" min="0" max="10" step="0.1" value="3.5" oninput="syncInput('sepal_width', 'sepal_width_range')">
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label>Petal Length</label>
                        </div>
                        <div class="input-control-wrap">
                            <input id="petal_length" type="number" step="0.1" value="1.4" oninput="syncRange('petal_length', 'petal_length_range')">
                            <input id="petal_length_range" type="range" min="0" max="10" step="0.1" value="1.4" oninput="syncInput('petal_length', 'petal_length_range')">
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label>Petal Width</label>
                        </div>
                        <div class="input-control-wrap">
                            <input id="petal_width" type="number" step="0.1" value="0.2" oninput="syncRange('petal_width', 'petal_width_range')">
                            <input id="petal_width_range" type="range" min="0" max="10" step="0.1" value="0.2" oninput="syncInput('petal_width', 'petal_width_range')">
                        </div>
                    </div>
                </div>

                <button onclick="predict()">🔍 Dự đoán kết quả</button>
            </div>

            <!-- Cột phải: Kết quả -->
            <div class="result-section">
                <div class="section-title">Kết quả</div>
                
                <div id="placeholder" class="placeholder-text">
                    Nhấn "Dự đoán kết quả" để xem chi tiết loài hoa...
                </div>

                <div id="result">
                    <div class="result-label">Loài hoa dự đoán:</div>
                    <div id="prediction"></div>
                    <img id="flower-image" src="" alt="Flower">
                </div>
            </div>

        </div>

        <a href="/" class="back">← Quay lại trang giới thiệu</a>
    </div>

    <script>
        // Hàm đồng bộ giá trị giữa Ô nhập số và Thanh kéo (Slider)
        function syncRange(inputId, rangeId) {
            document.getElementById(rangeId).value = document.getElementById(inputId).value;
        }

        function syncInput(inputId, rangeId) {
            document.getElementById(inputId).value = document.getElementById(rangeId).value;
        }

        async function predict() {
            const data = {
                sepal_length: Number(document.getElementById("sepal_length").value),
                sepal_width: Number(document.getElementById("sepal_width").value),
                petal_length: Number(document.getElementById("petal_length").value),
                petal_width: Number(document.getElementById("petal_width").value)
            };

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Có lỗi xảy ra");
                }

                // Hiển thị tên loài
                document.getElementById("prediction").innerText = result.prediction.toUpperCase();

                // Hiển thị hình tương ứng
                const image = document.getElementById("flower-image");
                image.src = "/photo/" + result.prediction + ".jpg";
                image.alt = result.prediction;

                // Ẩn chữ chờ và hiển thị kết quả
                document.getElementById("placeholder").style.display = "none";
                document.getElementById("result").style.display = "block";

            } catch (error) {
                alert("Không thể kết nối đến API: " + error.message);
            }
        }
    </script>

</body>

</html>
