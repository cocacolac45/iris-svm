<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Toggle Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Nút bấm Toggle Icon */
        .toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            width: 42px;
            height: 42px;
            background-color: #e11d48;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .toggle-btn:hover {
            background-color: #be123c;
            transform: scale(1.05);
        }

        /* Thanh bên (Sidebar) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -260px; /* Ẩn thanh bên về phía trái */
            width: 260px;
            height: 100vh;
            background-color: #1e293b;
            color: #ffffff;
            padding-top: 80px;
            transition: left 0.3s ease;
            z-index: 999;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.2);
        }

        /* Khi kích hoạt mở thanh bên */
        .sidebar.active {
            left: 0;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li a {
            display: block;
            padding: 15px 25px;
            color: #cbd5e1;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .sidebar ul li a:hover {
            background-color: #334155;
            color: #ffffff;
        }

        /* Vùng nội dung chính */
        .main-content {
            padding: 80px 20px 20px 80px;
        }
    </style>
</head>
<body>

    <!-- Nút bấm mở/đóng thanh bên -->
    <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">☰</button>

    <!-- Thanh bên -->
    <nav class="sidebar" id="sidebar">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Học tập</a></li>
            <li><a href="#">Dự án</a></li>
            <li><a href="#">Cài đặt</a></li>
        </ul>
    </nav>

    <!-- Nội dung trang -->
    <main class="main-content">
        <h1>Nội dung chính</h1>
        <p>Bấm vào nút icon phía trên bên trái để mở hoặc đóng thanh bên.</p>
    </main>

    <!-- Script điều khiển -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const toggleBtn = document.getElementById("toggleBtn");
            
            // Bật/tắt class active trên thanh bên
            sidebar.classList.toggle("active");
            
            // Đổi icon tương ứng với trạng thái đóng/mở
            if (sidebar.classList.contains("active")) {
                toggleBtn.textContent = "✕";
            } else {
                toggleBtn.textContent = "☰";
            }
        }
    </script>
</body>
</html>
